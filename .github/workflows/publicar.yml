name: Atualizar e publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Robô (YouTube, Instagram, planilha, links curtos)
        run: node robo/atualizar.mjs
        env:
          BEHOLD_FEED_URL: ${{ secrets.BEHOLD_FEED_URL }}

      - name: Guardar o que mudou
        id: salvar
        run: |
          git config user.name "robo-link-na-bio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          if git diff --cached --quiet; then echo "mudou=nao" >> "$GITHUB_OUTPUT"; else git commit -m "Robô: atualiza conteúdo"; git push; echo "mudou=sim" >> "$GITHUB_OUTPUT"; fi

      # só publica quando algo mudou (ou quando foi um envio manual)
      - if: steps.salvar.outputs.mudou == 'sim' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5

      - if: steps.salvar.outputs.mudou == 'sim' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        if: steps.salvar.outputs.mudou == 'sim' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
        with:
          error_count: 10
